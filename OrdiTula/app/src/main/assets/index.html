      const toast = document.getElementById('toast');

      text.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');

          btn.classList.remove('text-wine-900/60');

          btn.classList.remove('text-wine-800', 'bg-wine-800/12', 'font-extrabold');

      renderCurrentScreen();

        renderBuilderScreen(container);
      } else if (state.activeTab === 'swipe') {
        renderSwipeScreen(container);

    function setWalkFilter(filterName) {

    function spinOrdiRoulette() {
      if (state.routes.length === 0) return;
      let unseen = state.routes.filter(r => !state.seenRouletteIds.includes(r.id));
      if (unseen.length === 0) {
        state.seenRouletteIds = [];
        unseen = [...state.routes];
      }
      const picked = unseen[Math.floor(Math.random() * unseen.length)];
      state.seenRouletteIds.push(picked.id);
      state.quoteIndex = (state.quoteIndex + 1) % ORDI_QUOTES.length;
      showToast(`Орди выбрал: «${picked.title}»!`);
      openRouteDetail(picked.id);
    }

    function shuffleRoutesList() {
      for (let i = state.routes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.routes[i], state.routes[j]] = [state.routes[j], state.routes[i]];
      }
      state.quoteIndex = (state.quoteIndex + 1) % ORDI_QUOTES.length;
      showToast('Орди перемешал карточки прогулок!');
      renderWalksScreen(document.getElementById('main-content'));
    }

      }
      state.builder.customStreet = '';
      renderBuilderScreen(document.getElementById('main-content'));
    }

    function setBuilderStreet(streetName) {
      state.builder.street = streetName;
      state.builder.customStreet = '';
      renderBuilderScreen(document.getElementById('main-content'));
    }

    function setBuilderCustomStreet(val) {
      state.builder.customStreet = val;
    }

    function setBuilderField(field, value) {
      state.builder[field] = value;
      renderBuilderScreen(document.getElementById('main-content'));
    }

    function generateCustomRoute() {
      const b = state.builder;
      const distObj = TULA_DISTRICTS[b.district] || TULA_DISTRICTS.central;
      const customText = b.customStreet.trim();
      const activeStreetName = customText || b.street;
      const matchedStreet = distObj.streets.find(s => s.name === activeStreetName);

      const durationMeta = {
        short: { duration: '55 мин', walkTime: '35 мин ходьбы + 20 мин пауза', distance: '1,8 км', stepsCount: '~2 400 шагов' },
        medium: { duration: '1 ч 45 мин', walkTime: '1 ч 05 мин ходьбы + 40 мин пауза', distance: '3,1 км', stepsCount: '~4 100 шагов' },
        long: { duration: '2 ч 35 мин', walkTime: '1 ч 40 мин ходьбы + 55 мин пауза', distance: '4,8 км', stepsCount: '~6 400 шагов' }
      }[b.durationKey];

      const foodSpot = distObj.food[b.foodType] || distObj.food.coffee;
      const taskHint = BUILDER_TASKS_BY_VIBE[b.vibe] || BUILDER_TASKS_BY_VIBE.romance;

      const secondStreetObj = distObj.streets.find(s => s.name !== activeStreetName) || distObj.streets[0];
      const routePoints = matchedStreet
        ? [matchedStreet.coords, secondStreetObj.coords]
        : [`Тула, ${activeStreetName}`, `Тула, ${secondStreetObj.name}`];

      const newRoute = {
        id: 'custom-' + Date.now(),
        districtLabel: `${distObj.name} район · ${activeStreetName}`,
        title: `Прогулка: ${activeStreetName}`,
        subtitle: `Авторский сценарий от Орди в ${distObj.name.toLowerCase()}ом районе Тулы с уютным пит-стопом`,
        duration: durationMeta.duration,
        walkTime: durationMeta.walkTime,
        distance: durationMeta.distance,
        stepsCount: durationMeta.stepsCount,
        terrain: 'Городской маршрут · Комфортный темп',
        budget: b.budget,
        tags: ['Свой маршрут', durationMeta.duration.includes('55') ? 'До 1 часа' : '1.5–2 часа', 'Кофе и еда'],
        yandexMapsUrl: buildYandexRouteUrl(routePoints),
        steps: [
          {
            type: 'walk',
            title: `1. Старт: ${activeStreetName}`,
            desc: matchedStreet
              ? `Встречаемся в точке: ${matchedStreet.spot}. Начинаем неспешную прогулку по району.`
              : `Встречаемся на улице ${activeStreetName} (${distObj.name} район) и выбираем самое уютное направление.`,
            task: taskHint
          },
          {
            type: 'pitstop',
            badge: '🐾 Пит-стоп от Ордички · По пути',
            title: foodSpot.name,
            place: `${distObj.name} район, Тула`,
            recommend: foodSpot.dish,
            ordiNote: 'Я подобрал это место специально под ваш маршрут и бюджет!'
          },
          {
            type: 'walk',
            title: `2. Продолжение маршрута в сторону: ${secondStreetObj.name}`,
            desc: `Проходим по красивой части округа (${secondStreetObj.spot}) и завершаем свидание совместным фото.`
          }
        ]
      };

      state.customRoutes.unshift(newRoute);
      state.routes.unshift(newRoute);
      persistState();
      showToast('Орди собрал и сохранил ваш маршрут!');
      openRouteDetail(newRoute.id);
    }

    function renderSwipeScreen(container) {
      const idea = SWIPE_IDEAS[state.swipeIndex % SWIPE_IDEAS.length];

      container.innerHTML = `
        <div class="animate-screen space-y-4">
          <header class="text-center pt-1">
            <h1 class="vyaz-title text-2xl font-bold text-parchment-100">Свайп вдвоём</h1>
            <p class="text-xs text-parchment-200/80 mt-0.5">Листайте идеи по очереди, пока оба не скажете «Да!»</p>
            ${getOrnamentDivider()}
          </header>

          ${state.swipeMatched ? `
            <div class="paper-card ornament-frame rounded-3xl p-5 text-center space-y-3">
              <div class="flex justify-center">${getOrdiSVG('w-20 h-20')}</div>
              <div class="text-xs font-extrabold uppercase tracking-wider text-ochre-600">Совпадение найдено!</div>
              <h2 class="vyaz-title text-xl font-bold text-wine-950">${idea.title}</h2>
              <p class="text-xs text-wine-900/85">${idea.desc}</p>
              <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="openRouteDetail('${idea.routeId}')" class="bg-wine-800 text-parchment-100 font-extrabold text-xs py-3 rounded-2xl">Открыть план</button>
                <button onclick="resetSwipeGame()" class="bg-parchment-50 text-wine-950 border border-wine-800/20 font-bold text-xs py-3 rounded-2xl">Ещё круг</button>
              </div>
            </div>
          ` : `
            <div class="paper-card ornament-frame rounded-3xl p-5 space-y-4">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full bg-wine-800 text-parchment-100">Идея ${(state.swipeIndex % SWIPE_IDEAS.length) + 1} из ${SWIPE_IDEAS.length}</span>
                <span class="text-xs font-bold text-ochre-600">⏱ ${idea.time}</span>
              </div>

              <div class="py-3 space-y-2">
                <h2 class="vyaz-title text-2xl font-bold text-wine-950 leading-tight">${idea.title}</h2>
                <p class="text-xs text-wine-900/85 leading-relaxed">${idea.desc}</p>
              </div>

              <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="handleSwipeChoice(false)" class="py-3.5 rounded-2xl bg-parchment-50 border border-wine-800/20 text-wine-900 font-extrabold text-xs active:scale-95 transition-transform">
                  ✕ Не сегодня
                </button>
                <button onclick="handleSwipeChoice(true)" class="py-3.5 rounded-2xl bg-ochre-500 text-white font-extrabold text-xs shadow-md active:scale-95 transition-transform">
                  ♥ Идём сюда!
                </button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    function handleSwipeChoice(liked) {
      if (liked) {
        state.swipeMatched = true;
        showToast('Отличный выбор! Орди уже виляет хвостом.');
      } else {
        state.swipeIndex++;
      }
      renderSwipeScreen(document.getElementById('main-content'));
    }

    function resetSwipeGame() {
      state.swipeMatched = false;
      state.swipeIndex++;
      renderSwipeScreen(document.getElementById('main-content'));
    }

    function renderFoodScreen(container) {
      const cats = [
        { id: 'all', label: 'Все места' },
        { id: 'coffee', label: '☕ Кофе' },
        { id: 'sweet', label: '🥐 Десерты' },
        { id: 'fast', label: '🍕 Сытно' },
        { id: 'dinner', label: '🍷 Ужин' }
      ];

      const spots = state.foodCategory === 'all'
        ? FOOD_SPOTS
        : FOOD_SPOTS.filter(s => s.category === state.foodCategory);

      container.innerHTML = `
        <div class="animate-screen space-y-4">
          <header class="text-center pt-1">
            <h1 class="vyaz-title text-2xl font-bold text-parchment-100">Где перекусить?</h1>
            <p class="text-xs text-parchment-200/80 mt-0.5">Проверенные точки от Ордички на время прогулки</p>
            ${getOrnamentDivider()}
          </header>

          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
            ${cats.map(c => `
              <button onclick="setFoodCategory('${c.id}')" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold transition-all border ${
                state.foodCategory === c.id
                  ? 'bg-parchment-100 text-wine-950 border-parchment-100'
                  : 'burgundy-glass text-parchment-100/90'
              }">
                ${c.label}
              </button>
            `).join('')}
          </div>

          <div class="space-y-3">
            ${spots.map(s => `
              <div class="paper-card ornament-frame rounded-3xl p-4 space-y-2">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-ochre-500 text-white">${s.badge}</span>
                    <h3 class="text-sm font-extrabold text-wine-950 mt-1">${s.name}</h3>
                    <div class="text-[11px] text-wine-900/75">📍 ${s.area}</div>
                  </div>
                  <span class="text-xs font-extrabold text-ochre-600 bg-parchment-50 px-2 py-1 rounded-xl border border-wine-800/15">${s.budget}</span>
                </div>
                <p class="text-xs text-wine-950 bg-parchment-50/75 p-2.5 rounded-xl border border-wine-800/10">
                  <strong>Совет Ордички:</strong> ${s.dish}
                </p>
                <a href="${s.mapUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs font-extrabold text-wine-800 pt-0.5">
                  <span>Показать на Яндекс Картах</span>
                  <span>↗</span>
                </a>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function setFoodCategory(catId) {
      state.foodCategory = catId;
      renderFoodScreen(document.getElementById('main-content'));
    }

    function renderTulaTrackerScreen(container) {
      const doneRoutes = state.routes.filter(r => state.completedRoutes.includes(r.id));
      const totalKm = doneRoutes.reduce((sum, r) => {
        const num = parseFloat(String(r.distance).replace(',', '.'));
        return sum + (isNaN(num) ? 0 : num);
      }, 0);

      const badges = [
        { icon: '🏰', title: 'Стражи Кремля', unlocked: doneRoutes.length >= 1 },
        { icon: '🥨', title: 'Знатоки пряника', unlocked: doneRoutes.length >= 3 },
        { icon: '🐕', title: 'Лучшие друзья Орди', unlocked: state.customRoutes.length >= 1 },
        { icon: '🗺', title: 'Покорители Тулы', unlocked: doneRoutes.length >= 5 }
      ];

      container.innerHTML = `
        <div class="animate-screen space-y-4">
          <header class="text-center pt-1">
            <h1 class="vyaz-title text-2xl font-bold text-parchment-100">Наша Тула</h1>
            <p class="text-xs text-parchment-200/80 mt-0.5">Личная карта ваших совместных прогулок и достижений</p>
            ${getOrnamentDivider()}
          </header>

          <div class="paper-card ornament-frame rounded-3xl p-4 space-y-3">
            <div class="flex items-center gap-3">
              ${getOrdiSVG('w-16 h-16')}
              <div>
                <div class="text-[10px] font-extrabold uppercase tracking-wider text-ochre-600">Ваш прогресс</div>
                <div class="vyaz-title text-xl font-bold text-wine-950">${doneRoutes.length} из ${state.routes.length} маршрутов</div>
                <div class="text-xs font-bold text-wine-900/80 mt-0.5">Пройдено вместе: ~${totalKm.toFixed(1).replace('.', ',')} км</div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              ${badges.map(b => `
                <div class="p-2.5 rounded-2xl border flex items-center gap-2 ${
                  b.unlocked
                    ? 'bg-parchment-50/90 border-ochre-500/40 text-wine-950'
                    : 'bg-wine-950/10 border-wine-900/15 text-wine-950/45'
                }">
                  <span class="text-lg">${b.icon}</span>
                  <div class="text-[11px] font-extrabold leading-tight">${b.title}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="space-y-2.5">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-parchment-100/90 px-1">Пройденные прогулки</h3>
            ${doneRoutes.length === 0 ? `
              <div class="burgundy-glass rounded-3xl p-5 text-center text-xs text-parchment-100/85">
                Пока здесь пусто — открой любой маршрут и нажми «+ В дневник»!
              </div>
            ` : doneRoutes.map(r => `
              <div onclick="openRouteDetail('${r.id}')" class="cursor-pointer burgundy-glass rounded-2xl p-3.5 flex items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-extrabold text-parchment-100">${r.title}</div>
                  <div class="text-[10px] text-parchment-200/75 mt-0.5">⏱ ${r.duration} · 📍 ${r.distance}</div>
                </div>
                <span class="text-xs font-bold text-ochre-400">Открыть →</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initIconsAndServiceWorker();
      renderCurrentScreen();
    });

    function initIconsAndServiceWorker() {
      try {
        const ordiIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="112" fill="#4B131C"/>
          <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#DF8A58" stroke-width="6" stroke-dasharray="14 10"/>
          <polygon points="145,205 115,85 215,150" fill="#FFFFFF" stroke="#24070C" stroke-width="12" stroke-linejoin="round"/>
          <polygon points="367,205 397,85 297,150" fill="#FFFFFF" stroke="#24070C" stroke-width="12" stroke-linejoin="round"/>
          <circle cx="256" cy="248" r="128" fill="#FFFFFF" stroke="#24070C" stroke-width="12"/>
          <circle cx="206" cy="226" r="16" fill="#24070C"/>
          <circle cx="306" cy="226" r="16" fill="#24070C"/>
          <ellipse cx="256" cy="272" rx="25" ry="18" fill="#24070C"/>
          <path d="M224 304 Q256 330 288 304" fill="none" stroke="#24070C" stroke-width="11" stroke-linecap="round"/>
          <path d="M154 342 Q256 378 358 342 L322 438 L256 465 L190 438 Z" fill="#5A1822" stroke="#24070C" stroke-width="11" stroke-linejoin="round"/>
        </svg>`;

        const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ordiIconSvg);
        const iconLink = document.getElementById('pwa-icon');
        const appleIconLink = document.getElementById('pwa-apple-icon');
        if (iconLink) iconLink.href = iconUrl;
        if (appleIconLink) appleIconLink.href = iconUrl;

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      } catch (e) {}
    }
  </script>
</body>
